name: Build and Deploy Zenride API

on:
  push:
    branches: [develop]

env:
  DOTNET_VERSION: '8.0'
  PROJECT_PATH: src/Izigo.Api/Izigo.Api.csproj
  PUBLISH_OUTPUT: publish/api
  RESOURCE_GROUP: rg-zenride-za
  APP_NAME: zenride-api-tisa

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --output ./${{ env.PUBLISH_OUTPUT }}

      - name: Zip package
        run: cd ${{ env.PUBLISH_OUTPUT }} && zip -r ../../api.zip .

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            az webapp deploy \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ env.APP_NAME }} \
              --src-path api.zip \
              --type zip